networks:
  aigw-net:
    name: aigw-net

services:
  aigw-redis:
    image: redis:7.2-alpine
    container_name: aigw-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - aigw-net

#     image: registry.portkey.ai/airsgw/gateway_enterprise:2.19.1-prerelease2

  aigw-gateway:
    image: registry.portkey.ai/airsgw/gateway_enterprise:latest
    container_name: aigw-gateway
    restart: unless-stopped
    depends_on:
      aigw-redis:
        condition: service_healthy
    volumes:
      # Mount corporate CA cert so Node.js nd the OS trust it
      - ${HOME}/ca.crt:/etc/ssl/certs/corporate-ca.crt:ro
    environment:
      SERVER_MODE: all
      MCP_PORT: 8788
      # MCP_GATEWAY_BASE_URL: https://paramount-unchanged-feeble.ngrok-free.dev
      MCP_GATEWAY_BASE_URL: http://127.0.0.1:8788
      PORTKEY_CLIENT_AUTH: ${PORTKEY_CLIENT_AUTH}
      ORGANISATIONS_TO_SYNC: ${ORGANISATIONS_TO_SYNC}
      SERVICE_NAME: ${SERVICE_NAME}
      # Corporate CA cert — makes Node.js trust the cert in addition to its
      # built-in bundle (required when a TLS-inspecting firewall is in the path)
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/corporate-ca.crt
      SSL_CERT_FILE: /etc/ssl/certs/corporate-ca.crt
      # LOGGING Controls
      ANALYTICS_STORE: control_plane
      LOG_STORE: control_plane
      # REDIT Controls
      CACHE_STORE: redis
      REDIS_URL: redis://aigw-redis:6379
      # AIRS/Strata management plane (defaults in the image still point at the
      # legacy pre-acquisition control plane, which rejects Strata-issued tokens)
      ALBUS_BASEPATH: https://mp.us.prod.airs-gw.portkey.ai/api
      CONTROL_PLANE_BASEPATH: https://aigw.portkey.ai/v1
      CONFIG_READER_PATH: https://api.portkey.ai/v1/sync/model-configs
      # Enable Debug Logging
      LOG_LEVEL: DEBUG
      # JWT settings
      JWT_ENABLED: ON
      JWT_LOCAL_AUTH_DEFAULT_SCOPES: completions.write,mcp.invoke
      # JWT_LOCAL_AUTH_WORKSPACE_ALLOWLIST: "ws-marc2-3c7e6f,ws-marc-w-2bfa39,ws-main-a-997260,Main_workspace"
      # JWT_LOCAL_AUTH_DEFAULT_WORKSPACE: "ws-main-a-997260"
      # OTEL settings
      OTEL_PUSH_ENABLED: true
      OTEL_ENDPOINT: "http://otel-collector:4318"
      EXPERIMENTAL_GEN_AI_OTEL_TRACES_ENABLED: true
      EXPERIMENTAL_GEN_AI_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # LOCAL HOST ACCESS
      TRUSTED_CUSTOM_HOSTS: "localhost,127.0.0.1,::1,minio,otel-collector,aigw-redis,host.docker.internal"
    ports:
      - "8787:8787"
      - "8788:8788"
    networks:
      - aigw-net
